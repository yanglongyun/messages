name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1 }
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.1, cache: npm, cache-dependency-path: ui/package-lock.json }
      - run: npm ci && npm ci --prefix ui
      - run: npm run ui:build
      - run: npm run ui:test
      - run: git diff --exit-code -- ui/dist
